name: Feature request
description: Suggest something that would help you steer Claude Code
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow (how many sessions, loops, subagents) and where it hurts.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
